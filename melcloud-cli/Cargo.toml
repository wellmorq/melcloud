[package]
name = "melcloud-cli"
version = "1.0.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
melcloud-core = { path = "../melcloud-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.8"
tokio = { version = "0.2", features = ["macros", "rt-threaded", "time"] }
