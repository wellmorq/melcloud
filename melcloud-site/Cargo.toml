[package]
name = "melcloud-site"
version = "1.0.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.10", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.8"
thiserror = "1"
tokio = { version = "0.2", features = ["macros", "process", "rt-threaded", "sync", "time"] }
warp = { version = "0.2", default-features = false }
